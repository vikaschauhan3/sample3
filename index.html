<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vikas Chauhan · Project Samples</title>
  <meta name="description" content="Instructional design samples by Vikas Chauhan.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#fafafa;--card:#ffffff;--ink:#161616;--muted:#5b5b5b;--line:#ececec;--ring:#d5d5d5}
    *,*::before,*::after{box-sizing:border-box}
    html,body{margin:0;padding:0}
    body{font-family:"Poppins", system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
    a{color:inherit;text-decoration:none}
    a:focus{outline:2px dashed var(--ring);outline-offset:3px}
    .wrap{max-width:1100px;margin:0 auto;padding:28px}
    header{display:grid;gap:10px;margin:8px 0 6px}
    .title{font-weight:800;letter-spacing:-0.02em;font-size:clamp(28px,3.8vw,44px)}
    .sub{color:var(--muted);max-width:75ch}
    .bar{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
    .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;font-size:14px;cursor:pointer}
    .chip[aria-pressed="true"]{background:#f1f1f1;border-color:#bdbdbd}
    .grid{display:grid;gap:18px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));margin-top:18px}
    .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;transition:transform .12s ease, box-shadow .12s ease}
    .card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(0,0,0,.08)}
    .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:2px 8px;border-radius:999px;align-self:flex-start}
    .emoji{font-size:28px}
    .card h3{margin:0;font-size:18px;line-height:1.3}
    .card p{margin:0;color:var(--muted)}
    .links{margin-top:auto;display:flex;flex-wrap:wrap;gap:8px}
    .btn{border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;background:#f7f7f7}
    .btn:hover{background:#efefef}
    footer{margin:40px 0 12px;color:var(--muted);font-size:14px}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="title">Interactive HTML Samples</div>
      <div class="sub">Interactive HTML mini-tools and reflections used in varios courses.</div>
      <div class="bar" id="filters" role="toolbar" aria-label="Filter samples">
        <button class="chip" data-filter="all" aria-pressed="true">All</button>
        <button class="chip" data-filter="Strategy">Strategy</button>
        <button class="chip" data-filter="Career">Career</button>
        <button class="chip" data-filter="Storytelling">Storytelling</button>
        <button class="chip" data-filter="Sustainability">Sustainability</button>
        <button class="chip" data-filter="Transformation">Transformation</button>
      </div>
    </header>

    <section class="grid" id="grid" aria-live="polite"></section>

    <footer>© <span id="year"></span> Vikas Chauhan</footer>
  </div>

<script>
const samples = [
  { title: "Business Model Canvas", emoji: "🧩", tag: "Strategy", path: "assets/Business%20Model.html", desc: "A structured canvas with inputs and PDF export for customers, channels, value, and more." },
  { title: "Finding Your Ikigai", emoji: "🌸", tag: "Career", path: "assets/Finding%20Your%20Ikigai.html", desc: "Guided exercise across the four pillars with smart intersections and a printable summary." },
  { title: "Future Story", emoji: "🗺️", tag: "Storytelling", path: "assets/Future%20Story.html", desc: "Ten-step narrative builder using a rich text editor; exports a well-formatted PDF." },
  { title: "SDG Goals", emoji: "🌍", tag: "Sustainability", path: "assets/SDG%20Goals.html", desc: "Flip-card explorer of the 17 SDGs with reflection sliders and a consolidated report." },
  { title: "Transformational Shift", emoji: "⚡", tag: "Transformation", path: "assets/Transformational%20Shift.html", desc: "Capture current vs. future states and generate a concise transformation summary." }
];

function cardTemplate(item){
  return `
    <article class="card" data-tag="${item.tag}">
      <span class="tag">${item.tag}</span>
      <div class="emoji" aria-hidden="true">${item.emoji}</div>
      <h3>${item.title}</h3>
      <p>${item.desc}</p>
      <div class="links">
        <a class="btn" href="${item.path}" target="_blank" rel="noopener">Open demo</a>
        <a class="btn" href="${item.path}" download>Download HTML</a>
      </div>
    </article>`;
}

function render(filter="all"){
  const grid = document.getElementById("grid");
  const list = filter==="all" ? samples : samples.filter(s => s.tag===filter);
  grid.innerHTML = list.map(cardTemplate).join("");
  if(list.length === 0){ grid.innerHTML = '<p>No items match that filter.</p>'; }
}

function setupFilters(){
  const chips = document.querySelectorAll(".chip");
  chips.forEach(ch => ch.addEventListener("click", () => {
    chips.forEach(c => c.setAttribute("aria-pressed","false"));
    ch.setAttribute("aria-pressed","true");
    render(ch.dataset.filter);
  }));
}

document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("year").textContent = new Date().getFullYear();
  setupFilters();
  render();
});
</script>
</body>
</html>
